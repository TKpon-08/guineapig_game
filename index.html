<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2e5cb"><title>もるっと暮らし</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d7c5a8;color:#3e3029;font-family:system-ui,-apple-system,sans-serif}main{max-width:480px;min-height:100dvh;margin:auto;background:#f6ecd9;padding:12px 12px 28px}h1{font-size:23px;margin:3px 0 12px;color:#6a3f2b;text-shadow:2px 2px #e5b88a}.shell{border:4px solid #3e5063;box-shadow:inset 0 0 0 3px #9db0b3,0 4px #9c8069;background:#e5d7ba}.top{display:flex;gap:8px;justify-content:space-between;padding:9px}.status{background:#fff7e7;border:3px solid #40576a;box-shadow:3px 3px #a8b6b3;padding:8px;width:62%;font-size:12px}.status strong{font-size:15px}.stat{display:flex;align-items:center;gap:5px;margin-top:6px}.stat label{width:50px;flex:none;font-weight:700}.track{flex:1;height:11px;background:#deded3;border:2px solid #65727a}.fill{height:100%;background:#91bc74}.date{align-self:flex-start;background:#fff7e7;border:3px solid #40576a;padding:9px 5px;font-size:12px;font-weight:700;white-space:nowrap}.room{position:relative;background:#d7c5a8}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}.bubble{position:absolute;left:12px;bottom:12px;background:#fff8e6;border:2px solid #70543b;padding:5px 10px;font-size:13px;max-width:85%}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:11px 8px;background:#50677b}.buttons button{border:3px solid #263e52;box-shadow:inset 0 0 0 2px #fff8e6,0 3px #283e4d;background:#fff4df;border-radius:6px;min-height:63px;font-size:13px;font-weight:800;color:#34475a;cursor:pointer}.buttons button span{display:block;font-size:22px;margin-bottom:3px}.buttons button:active{transform:translateY(2px)}.help{text-align:center;font-size:12px;color:#75634f;line-height:1.7;margin:18px 4px}
</style></head><body><main><h1>🐹 もるっと暮らし <small style="font-size:11px">ver.0.2</small></h1><div class="shell"><div class="top"><div class="status"><strong>🐹 もるちゃん</strong><div class="stat"><label>おなか</label><div class="track"><div id="hunger" class="fill"></div></div></div><div class="stat"><label>きげん</label><div class="track"><div id="mood" class="fill" style="background:#e79d9c"></div></div></div><div class="stat"><label>きれい</label><div class="track"><div id="clean" class="fill" style="background:#89b7cb"></div></div></div></div><div class="date" id="date">DAY 1 ☀️</div></div><div class="room"><canvas id="game" width="256" height="224" aria-label="レトロなドット絵のお部屋とモルモット"></canvas><div class="bubble" id="bubble" aria-live="polite">ぷいぷい♪</div></div><div class="buttons"><button id="feed"><span>🥬</span>ごはん</button><button id="pet"><span>🖐️</span>なでる</button><button id="tidy"><span>🧹</span>そうじ</button></div></div><p class="help">モルモットをタップしてもなでられるよ。<br>お世話の記録はこのブラウザに自動保存されるよ。</p></main>
<script>
(()=>{
'use strict';
const key='morutto-save-v1',now=Date.now();let old={};try{old=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
const limit=n=>Math.max(0,Math.min(100,n));const s={hunger:80,mood:80,clean:90,born:now,last:now,...old};const hours=Math.max(0,Math.min(720,(now-s.last)/3600000));s.hunger=limit(s.hunger-hours*1.5);s.mood=limit(s.mood-hours*.6);s.clean=limit(s.clean-hours*.8);
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);let x=119,goal=119,dir=1,action='idle',actionEnd=0,tick=0;
const p=(x,y,w,h,color)=>{g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)};
function save(){s.last=Date.now();try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function update(){for(const k of ['hunger','mood','clean'])$(k).style.width=limit(s[k])+'%';$('date').textContent='DAY '+(Math.floor((Date.now()-s.born)/86400000)+1)+' ☀️'}
function doAction(a){action=a;actionEnd=performance.now()+1800;if(a==='feed'){s.hunger=limit(s.hunger+22);$('bubble').textContent='もぐもぐ♪'}if(a==='pet'){s.mood=limit(s.mood+18);$('bubble').textContent='ぷいぷい♡'}if(a==='tidy'){s.clean=limit(s.clean+30);$('bubble').textContent='ぴかぴか！'}update();save()}
$('feed').onclick=()=>doAction('feed');$('pet').onclick=()=>doAction('pet');$('tidy').onclick=()=>doAction('tidy');c.addEventListener('pointerdown',()=>doAction('pet'));
function room(){p(0,0,256,142,'#d9d1b7');p(0,0,256,5,'#b4a991');p(0,118,256,24,'#aa815d');for(let i=0;i<256;i+=16)p(i,121,2,19,'#8d6c52');p(0,140,256,84,'#d4a36c');for(let y=148;y<224;y+=17)p(0,y,256,2,'#b78457');for(let i=0;i<9;i++)p(i*32+(i%2)*13,151,2,70,'#c18f60');
 // window
 p(87,21,79,69,'#8e6649');p(92,26,69,59,'#8ac2d4');p(96,31,61,31,'#a6d5e3');p(96,64,61,17,'#83ac76');p(100,68,17,13,'#6f9b64');p(120,61,18,20,'#76a268');p(143,65,13,16,'#6c965f');p(123,26,5,59,'#8e6649');p(92,52,69,5,'#8e6649');p(84,89,85,5,'#9c7958');
 // wall art
 p(187,48,32,40,'#956d4e');p(191,52,24,32,'#f4e5c5');p(201,58,5,18,'#73a46c');p(196,64,15,7,'#85b575');
 // house
 p(18,123,62,43,'#916a49');p(24,116,50,7,'#b58a59');p(23,127,52,34,'#c49660');for(let i=0;i<4;i++)p(28,132+i*7,40,1,'#b18254');p(46,141,23,25,'#694932');p(51,136,14,7,'#694932');
 // water bottle
 p(230,98,17,38,'#3e5d77');p(233,100,11,27,'#a8d4e7');p(235,109,7,15,'#d9edf0');p(236,136,5,16,'#58788c');
 // hay
 for(let i=0;i<28;i++){const a=i*2.4;p(8+(i*13)%56,185+(i*7)%16,13,3,i%3===0?'#8d9b57':i%3===1?'#a7b46a':'#bdba70')}
 // bowl
 p(190,175,40,15,'#5a6870');p(194,175,32,9,'#d3d8cd');p(198,176,24,5,'#a88b57');for(let i=0;i<8;i++)p(199+i*3,176+i%2*2,2,2,'#6c6e43');
 // bed
 p(194,197,54,20,'#b97580');p(198,194,46,18,'#e8a4ac');p(206,198,30,8,'#d48b98');
}
function pig(t){const bob=action==='pet'?Math.sin(t/90)*2:action==='idle'&&Math.abs(goal-x)>3?Math.sin(t/100)*1:0;const X=Math.round(x),Y=Math.round(171+bob);
p(X-35,Y+22,73,6,'#b88d64');
 // chunky, horizontal guinea pig body with short feet
 p(X-37,Y-16,74,39,'#47362e');p(X-32,Y-23,61,9,'#47362e');p(X-32,Y-17,65,35,'#b87945');p(X-27,Y-21,52,9,'#bb8250');p(X-34,Y-8,11,19,'#b87945');p(X+18,Y-17,18,32,'#fff1d9');p(X+2,Y-20,17,35,'#fff1d9');p(X-4,Y-18,10,30,'#fff1d9');p(X-18,Y+13,48,7,'#f2dec1');
 // feet
 p(X-25,Y+18,13,7,'#c98d82');p(X+20,Y+18,12,7,'#c98d82');
 // ears and cheeks
 p(X+8,Y-27,16,17,'#503a31');p(X+10,Y-24,12,12,'#a56b52');p(X+13,Y-22,7,7,'#c78b80');p(X+22,Y-13,17,25,'#f9ead3');p(X+26,Y-5,10,12,'#f9ead3');
 // eye, nose
 p(X+26,Y-13,5,6,'#29272a');p(X+27,Y-12,2,2,'#fff6e6');p(X+37,Y+2,4,3,'#d58b8a');p(X+34,Y+7,3,2,'#705248');
 // fur highlights
 p(X-27,Y-17,12,3,'#d39a62');p(X-19,Y-19,8,3,'#d39a62');p(X-30,Y+3,5,8,'#a36a40');
 if(action==='feed'){p(X+37,Y+9,13,5,'#5f9653');p(X+44,Y+2,4,11,'#80ae60')}if(action==='pet'){p(X+9,Y-40,7,7,'#e78c91');p(X+23,Y-48,6,6,'#e78c91')}if(action==='tidy'){p(X+42,Y-23,5,5,'#fff4c5')}
}
function draw(t){tick++;room();if(t>actionEnd){action='idle';if(tick%250===0)$('bubble').textContent='ぷいぷい♪'}if(action==='idle'){if(tick%190===0)goal=87+Math.random()*65;x+=(goal-x)*.017}pig(t);requestAnimationFrame(draw)}
update();save();setInterval(()=>{s.hunger=limit(s.hunger-.025);s.mood=limit(s.mood-.01);s.clean=limit(s.clean-.014);update();save()},60000);requestAnimationFrame(draw);
})();
</script></body></html>
