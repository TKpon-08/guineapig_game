<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e9d4"><title>もるっと暮らし</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8d8c3;color:#604c3b;font-family:system-ui,-apple-system,sans-serif}main{max-width:440px;min-height:100dvh;margin:auto;background:#fff7e9;padding:16px 16px 28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:4px 0 12px}.pill{background:#f2dfc4;border-radius:20px;padding:8px 12px;font-size:13px}.room{position:relative;border:6px solid #d6b28b;border-radius:16px;overflow:hidden;background:#e9d1ad}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:manipulation}.speech{position:absolute;left:12px;top:12px;background:#fff9ed;border-radius:14px;padding:7px 12px;font-size:13px;box-shadow:0 2px 0 #d6b28b}.stats{margin:20px 0 14px;display:grid;gap:10px}.stat{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:8px;font-size:14px}.bar{height:13px;background:#e8dfd1;border-radius:20px;overflow:hidden}.fill{height:100%;background:#9dbd80;transition:width .3s}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{border:0;border-radius:14px;background:#f0d9b6;color:#604c3b;font-size:15px;font-weight:700;padding:16px 4px;cursor:pointer;box-shadow:0 4px 0 #cda77d}button:active{transform:translateY(3px);box-shadow:0 1px 0 #cda77d}.note{font-size:12px;line-height:1.6;color:#8d7967;margin-top:20px;text-align:center}
</style></head><body><main><header><h1>🐹 もるっと暮らし</h1><span class="pill" id="day">DAY 1</span></header><div class="room"><canvas id="game" width="320" height="280" aria-label="お部屋で暮らすモルモット"></canvas><div class="speech" id="speech" aria-live="polite">ぷいぷい♪</div></div><section class="stats"><div class="stat"><span>🥬 おなか</span><div class="bar"><div class="fill" id="hungerBar"></div></div><span id="hungerText"></span></div><div class="stat"><span>💕 ごきげん</span><div class="bar"><div class="fill" id="moodBar"></div></div><span id="moodText"></span></div><div class="stat"><span>✨ きれい</span><div class="bar"><div class="fill" id="cleanBar"></div></div><span id="cleanText"></span></div></section><div class="actions"><button id="feed">🥬<br>ごはん</button><button id="pet">🖐️<br>なでる</button><button id="clean">🧹<br>おそうじ</button></div><p class="note">のんびりお世話してね。データはこのブラウザに自動保存されるよ。<br>モルモットはお留守番しても元気だよ。</p></main>
<script>
(()=>{
const key='morutto-save-v1',now=Date.now();let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const clamp=n=>Math.max(0,Math.min(100,n));const state={hunger:80,mood:80,clean:90,born:now,last:now,...saved};const elapsed=Math.max(0,Math.min((now-state.last)/3600000,720));state.hunger=clamp(state.hunger-elapsed*1.5);state.mood=clamp(state.mood-elapsed*.6);state.clean=clamp(state.clean-elapsed*.8);state.last=now;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let x=160,target=160,action='idle',until=0,frame=0;const $=id=>document.getElementById(id);
function save(){state.last=Date.now();try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function ui(){for(const [name,val] of [['hunger',state.hunger],['mood',state.mood],['clean',state.clean]]){$(name+'Bar').style.width=val+'%';$(name+'Text').textContent=Math.round(val)+'%'}$('day').textContent='DAY '+(Math.floor((Date.now()-state.born)/86400000)+1)}
function say(s){$('speech').textContent=s}
function doAction(kind){action=kind;until=performance.now()+1600;if(kind==='feed'){state.hunger=clamp(state.hunger+22);say('もぐもぐ♪')}if(kind==='pet'){state.mood=clamp(state.mood+18);say('ぷいぷいっ♡')}if(kind==='clean'){state.clean=clamp(state.clean+30);say('ぴかぴか！')}ui();save()}
$('feed').onclick=()=>doAction('feed');$('pet').onclick=()=>doAction('pet');$('clean').onclick=()=>doAction('clean');canvas.addEventListener('pointerdown',()=>doAction('pet'));
function rect(px,py,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(px),Math.round(py),w,h)}
function draw(t){frame++;rect(0,0,320,280,'#ead6b7');rect(0,174,320,106,'#caa37a');for(let i=0;i<8;i++)rect(0,180+i*15,320,1,'#b78d68');rect(28,42,78,110,'#a47c5a');rect(35,49,64,96,'#dfc49e');rect(41,55,52,42,'#a6b69a');rect(41,103,52,36,'#f4e6c8');rect(236,102,66,67,'#ad815c');rect(245,115,48,54,'#765540');rect(255,133,28,36,'#3d3029');rect(14,207,66,28,'#ad7952');rect(19,207,56,10,'#8cb476');rect(22,200,5,16,'#6d985f');rect(33,195,5,21,'#80a96c');rect(45,201,5,17,'#69925b');if(frame%140===0&&action==='idle')target=85+Math.random()*140;if(action==='idle')x+=(target-x)*.012;if(t>until){action='idle';if(frame%240===0)say('ぷいぷい♪')}
const bounce=action==='pet'?Math.sin(t/85)*3:Math.abs(target-x)>5?Math.sin(t/110)*2:Math.sin(t/550)*1.5;const gx=Math.round(x),gy=Math.round(195+bounce);
rect(gx-48,gy+37,100,9,'#b58b6b');rect(gx-44,gy-20,88,62,'#f5e4c8');rect(gx-34,gy-38,23,28,'#ae7b52');rect(gx+12,gy-38,23,28,'#ae7b52');rect(gx-28,gy-32,12,15,'#d9a4a0');rect(gx+17,gy-32,12,15,'#d9a4a0');rect(gx-24,gy-27,48,54,'#b98352');rect(gx-35,gy+27,16,13,'#f5e4c8');rect(gx+19,gy+27,16,13,'#f5e4c8');rect(gx-22,gy-2,7,9,'#2f2928');rect(gx+15,gy-2,7,9,'#2f2928');rect(gx-3,gy+10,7,5,'#d99894');if(action==='feed'){rect(gx-4,gy+24,14,7,'#82b569');rect(gx+4,gy+18,4,9,'#5d9251')}if(action==='pet'){rect(gx-32,gy-60,10,10,'#db8b85');rect(gx+25,gy-68,8,8,'#db8b85')}if(action==='clean'){rect(195,218,8,8,'#fff7d7');rect(210,204,6,6,'#fff7d7')}requestAnimationFrame(draw)}
ui();save();setInterval(()=>{state.hunger=clamp(state.hunger-.025);state.mood=clamp(state.mood-.01);state.clean=clamp(state.clean-.014);ui();save()},60000);requestAnimationFrame(draw);
})();
</script></body></html>
